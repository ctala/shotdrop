<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  body { width: 440px; height: 280px; }
  .glow::before { width: 500px; height: 500px; left: -220px; top: -260px; }
  .grid { height: 60%; background-size: 32px 32px; }
  .content { height: 100%; padding: 34px 32px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; }
  .brand .wordmark { font-size: 40px; }
  p { font: 700 19px/1.3 var(--mono); color: var(--text); }
</style>
</head>
<body class="glow">
  <div class="grid"></div>
  <div class="content">
    <div class="brand"><img src="icon.svg" alt=""><span class="wordmark">shotdrop<span class="cursor">_</span></span></div>
    <p data-en>Drop a screenshot.<br>Get a link that <span class="hl">expires</span>.</p>
    <p data-es>Suelta una captura.<br>Recibe un link que <span class="hl">caduca</span>.</p>
  </div>
  <script src="lang.js"></script>
</body>
</html>
