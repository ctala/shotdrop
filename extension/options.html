<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>shotdrop — configuración</title>
<style>
  body {
    margin: 0; padding: 32px; background: #14141c; color: #ececf2; max-width: 520px;
    font: 14px/1.6 -apple-system, system-ui, sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.sub { color: #9a9aab; margin: 0 0 24px; font-size: 13px; }
  label { display: block; margin: 16px 0 5px; font-size: 12px; color: #9a9aab; }
  input {
    width: 100%; padding: 9px 11px; background: #1e1e2a; border: 1px solid #32323f;
    border-radius: 7px; color: #ececf2; font-family: ui-monospace, monospace; font-size: 13px;
  }
  input:focus { outline: none; border-color: #39ff14; }
  button {
    margin-top: 22px; padding: 9px 20px; background: #39ff14; border: 0; border-radius: 7px;
    color: #14141c; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  #ok { margin-left: 12px; color: #39ff14; font-size: 13px; }
  .nota { margin-top: 26px; padding-top: 18px; border-top: 1px solid #32323f;
          color: #9a9aab; font-size: 12px; }
</style>
</head>
<body>
  <h1>shotdrop</h1>
  <p class="sub">Dónde se suben las capturas y con qué token.</p>

  <label for="endpoint">Endpoint</label>
  <input id="endpoint" placeholder="https://shots.cristiantala.com" spellcheck="false">

  <label for="token">Token de subida</label>
  <input id="token" type="password" placeholder="el valor de UPLOAD_TOKEN" spellcheck="false">

  <button id="guardar">Guardar</button><span id="ok"></span>

  <p class="nota">
    El token solo sirve para subir. Si alguna vez se filtra, lo cambias con
    <code>wrangler secret put UPLOAD_TOKEN</code> y lo vuelves a pegar aquí.
    Las llaves de R2 nunca pasan por el navegador.
  </p>

  <script src="comun.js"></script>
  <script src="options.js"></script>
</body>
</html>
