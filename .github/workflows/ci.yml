name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (real extension against wrangler dev)
        run: npm run test:e2e
      - name: Build the Chrome Web Store package
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: shotdrop-extension
          path: dist/*.zip
